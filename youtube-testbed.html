<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip It — YouTube Test-bed</title>
<style>
  :root{--bg:#0f0f0f;--card:#181818;--text:#f1f1f1;--muted:#9a9a9a;--accent:#ff0033;--border:#272727;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:16px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5;}
  header h1{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:.2px;}
  .input-row{display:flex;gap:8px;margin-bottom:10px;}
  textarea{flex:1;min-height:56px;background:#121212;color:var(--text);border:1px solid #303030;border-radius:8px;padding:10px;font-size:13px;resize:vertical;}
  button.load{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 22px;font-size:13px;font-weight:600;cursor:pointer;}
  button.load:hover{opacity:.9;}
  .layout-row{display:flex;align-items:center;gap:6px;}
  .layout-row span{font-size:12px;color:var(--muted);margin-right:4px;}
  .layout-btn{background:#1c1c1c;border:1px solid var(--border);color:var(--muted);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .layout-btn.active{background:#2a2a2a;color:var(--text);border-color:#444;}
  .grid{display:grid;gap:22px;padding:24px;}
  .grid.cols-1{grid-template-columns:1fr;max-width:900px;margin:0 auto;}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  .card .player{position:relative;padding-top:56.25%;background:#000;}
  .card .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .meta{padding:12px 14px;}
  .title{font-size:13px;color:var(--muted);margin-bottom:10px;word-break:break-all;line-height:1.4;}
  .actions{display:flex;gap:6px;}
  .actions button{flex:1;background:#232323;border:1px solid var(--border);color:var(--text);padding:9px 0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .actions button:hover{background:#2e2e2e;}
  .actions button.delete-btn:hover{background:#4a1c1c;border-color:#6a2626;}
  .actions button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .comment-box{display:none;margin-top:8px;}
  .comment-box.open{display:block;}
  .comment-box input{width:100%;background:#121212;border:1px solid #303030;color:var(--text);border-radius:6px;padding:7px 8px;font-size:13px;}
  .comment-saved{font-size:11px;color:var(--muted);margin-top:6px;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1;}
  #floatWrap{position:fixed;z-index:50;display:none;}
  #floatWrap.show{display:block;}
  .float-card{width:480px;background:#181818;border:1px solid #333;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);overflow:hidden;resize:horizontal;min-width:240px;max-width:900px;}
  .float-head{cursor:move;background:#202020;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);user-select:none;}
  .float-head button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;}
  .float-head button:hover{color:var(--text);}
  .float-body{position:relative;padding-top:56.25%;background:#000;}
  .float-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
</style>
</head>
<body>
<header>
  <h1>Clip It — YouTube Test-bed</h1>
  <div class="input-row">
    <textarea id="linkInput" placeholder="Paste YouTube links, comma-separated..."></textarea>
    <button class="load" onclick="loadLinks()">Load</button>
  </div>
  <div class="layout-row">
    <span>Layout</span>
    <button class="layout-btn" data-cols="1" onclick="setLayout(1)" title="1 column">&#9646;</button>
    <button class="layout-btn active" data-cols="2" onclick="setLayout(2)" title="2 columns">&#9646;&#9646;</button>
    <button class="layout-btn" data-cols="3" onclick="setLayout(3)" title="3 columns">&#9646;&#9646;&#9646;</button>
  </div>
</header>
<div class="grid cols-2" id="grid"><div class="empty">Paste links above and click Load.</div></div>
<div id="floatWrap">
  <div class="float-card" id="floatCard">
    <div class="float-head" id="floatHead">
      <span>Now playing</span>
      <button onclick="closeFloat()" title="Close">&times;</button>
    </div>
    <div class="float-body" id="floatBody"></div>
  </div>
</div>
<script>
const icons = {
  comment: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  visit: '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
  delete: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  expand: '<svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>',
  like: '<svg viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>'
};
function extractId(url){
  const m = url.match(/(?:youtu\.be\/|v=|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function setLayout(cols){
  document.getElementById('grid').className = 'grid cols-' + cols;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.toggle('active', b.dataset.cols == cols));
}
function loadLinks(){
  const raw = document.getElementById('linkInput').value;
  const links = raw.split(',').map(s=>s.trim()).filter(Boolean);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(!links.length){ grid.innerHTML = '<div class="empty">No links found.</div>'; return; }
  links.forEach((link, idx) => {
    const id = extractId(link);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="player">
        ${id ? `<iframe src="https://www.youtube.com/embed/${id}" referrerpolicy="no-referrer" allow="autoplay; encrypted-media" allowfullscreen></iframe>` : `<div class="empty">Invalid link</div>`}
      </div>
      <div class="meta">
        <div class="title">${link}</div>
        <div class="actions">
          <button onclick="openFloat('${id}')" title="Expand">${icons.expand}</button>
          <button class="comment-btn" onclick="toggleComment(${idx})" title="Comment">${icons.comment}</button>
          <button class="like-btn" onclick="toggleLike(this)" title="Like">${icons.like}</button>
          <button onclick="window.open('${link}','_blank')" title="Visit">${icons.visit}</button>
          <button class="delete-btn" onclick="deleteCard(this)" title="Delete">${icons.delete}</button>
        </div>
        <div class="comment-box" id="comment-${idx}">
          <input type="text" placeholder="Add a note..." onkeydown="if(event.key==='Enter')saveComment(this,${idx})">
          <div class="comment-saved" id="saved-${idx}"></div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}
function toggleComment(idx){ document.getElementById('comment-'+idx).classList.toggle('open'); }
function saveComment(input, idx){ document.getElementById('saved-'+idx).textContent = 'Saved: "' + input.value + '"'; }
function deleteCard(btn){ btn.closest('.card').remove(); }
function toggleLike(btn){ btn.classList.toggle('active'); }
const floatWrap = document.getElementById('floatWrap');
const floatBody = document.getElementById('floatBody');
const floatHead = document.getElementById('floatHead');
let dragging = false, offX = 0, offY = 0;
function openFloat(id){
  if(!id) return;
  floatBody.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" referrerpolicy="no-referrer" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  floatWrap.style.left = (window.innerWidth - 520) + 'px';
  floatWrap.style.top = '90px';
  floatWrap.classList.add('show');
}
function closeFloat(){ floatWrap.classList.remove('show'); floatBody.innerHTML = ''; }
floatHead.addEventListener('mousedown', e => {
  dragging = true;
  const rect = floatWrap.getBoundingClientRect();
  offX = e.clientX - rect.left;
  offY = e.clientY - rect.top;
});
document.addEventListener('mousemove', e => {
  if(!dragging) return;
  floatWrap.style.left = (e.clientX - offX) + 'px';
  floatWrap.style.top = (e.clientY - offY) + 'px';
});
document.addEventListener('mouseup', () => dragging = false);
</script>
</body>
</html>
